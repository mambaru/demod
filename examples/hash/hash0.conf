{
  "core":{
    "status":{
      "warnings_ttl_ms":"2m",
      "hang_timeout_ms":"10s"
    },
    "common-workflow": {
      "control_ms": "1s",
      "threads":0
    }
  },
  "config": {
      "reload_changed_ms": 1000,
      "reload_sighup": true
  },
  "workflow":[{
    "name": "workflow1",
    "threads":0,
    "status_ms": "10s"
  }],
  "prometheus": [
    {
      "enabled": true,
      "workflow":{"threads":0},
      "addr": "127.0.0.1",
      "name": "prometheus1",
      "port": "8080",
      "shutdown_priority": 0,
      "startup_priority": 0
    }
  ],

  "logger": {
    "startup_priority": -1000,
    "shutdown_priority": 1000,
    "stop_with_fatal_log_entry":true,
    "path":"./hash0.log",
    "resolution":"milliseconds",
    "startup_rotate":true,
    "rotation":3/*,*/
    /*"colorized":"none",*/
    /*"allow":["MESSAGE"],*/
    /*"customize":[
      {
        "names":["IOW"],
        "allow":["TRACE"]
      }
    ]*/
  },
  "hash": [ 
    {
      "name": "hash1",
      "suspend":false,
      "param":true
    } 
  ],
  "hash-service": [
    {
      "name": "hash-service1",
      "suspend":false,
      "target": "hash1",
      "allow_non_jsonrpc":true
    }
  ],
  "server-tcp": [
    {
      "name": "server-tcp1",
      "target": "hash-service1",
      "suspend":false,
      "addr": "0.0.0.0",
      "port": "12346",
      "workflow":{
        "threads":0
      },
      "threads":0,
      "connection": {
        "direct_mode":true,
        "reader": { "sep": "\r\n", "bufsize": 256, "trimsep":true},
        "writer": { "sep": "\r\n", "bufsize": 256}
      }
    },
    {
      "name": "server-tcp2",
      "target": "hash-service1",
      "suspend":false,
      "addr": "0.0.0.0",
      "port": "12345",
      "connection": {"direct_mode":true}
    }
  ]
}
